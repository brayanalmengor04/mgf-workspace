name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RAILWAY_SERVICE: mgf-workspace
  RAILWAY_SERVICE_ID: 1462a593-56ac-48cd-9fce-4f0af8dfa985

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker services
        env:
          APP_KEY: base64:dGVzdC1rZXktZm9yLWNpLW9ubHktZG9udC1jb21taXQ=
        run: docker compose up -d --build --wait

      - name: Install dev dependencies
        run: docker compose exec -T app composer install --no-interaction

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force --no-interaction

      - name: Run tests
        run: docker compose exec -T app ./vendor/bin/phpunit

      - name: Verify database schema
        run: docker compose exec -T app php artisan mgf:migrate-doctor

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          railway --version
          railway up \
            --service="${{ env.RAILWAY_SERVICE }}" \
            --ci \
            --verbose \
            -m "github@${{ github.sha }}"
