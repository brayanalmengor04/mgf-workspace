name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Nombre exacto del servicio en Railway (Settings del servicio).
  RAILWAY_SERVICE: mgf-workspace
  # ID del servicio (solo referencia / debug; el CLI usa --service con el nombre).
  RAILWAY_SERVICE_ID: 1462a593-56ac-48cd-9fce-4f0af8dfa985

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Builds Docker en Railway pueden tardar varios minutos.
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          railway --version
          railway up \
            --service="${{ env.RAILWAY_SERVICE }}" \
            --ci \
            --verbose \
            -m "github@${{ github.sha }}"
